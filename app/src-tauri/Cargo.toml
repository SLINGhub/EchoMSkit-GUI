[package]
name = "echomskit-gui"
version = "1.0.0"
description = "cross-platform graphical interface for EchoMSkit"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = { version = "0.38.0", default-features = false }
csv = "1.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
toml = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
zip = { version = "9.4.0", default-features = false }
